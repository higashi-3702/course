<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フロンティアコース - 整理券配布状況</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-900 text-white flex flex-col justify-between p-6">

    <header class="max-w-xl mx-auto w-full text-center pt-8">
        <h1 class="text-3xl font-black text-slate-100">フロンティアコース</h1>
        <p class="text-sm font-bold text-slate-400 mt-2">整理券 配布状況（リアルタイム）</p>
    </header>

    <main class="max-w-xl mx-auto w-full text-center my-auto">
        <div class="bg-slate-800/80 border border-slate-700/50 rounded-3xl p-8 shadow-2xl backdrop-blur-sm">
            <div id="statusBadge" class="inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mb-6">
                配布中
            </div>
            
            <div class="flex justify-center items-baseline gap-2">
                <span id="currentCount" class="text-8xl md:text-9xl font-black tracking-tight text-white">---</span>
                <span class="text-2xl font-bold text-slate-400">枚</span>
            </div>
        </div>
    </main>

    <footer class="max-w-xl mx-auto w-full text-center pb-6">
        <div class="inline-flex items-center gap-2 text-xs font-semibold text-slate-500">
            <span id="dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>LIVE 画面更新中</span>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://aaonelfelxfzcwcsaqqw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__OHmH6f6jAio-k11HnMxIQ_Y6t7Xk8V';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false }
        });

        // フロンティアのIDは 1
        const TARGET_ID = 1; 

        async function fetchCount() {
            try {
                const { data, error } = await supabaseClient
                    .from('tickets')
                    .select('count')
                    .eq('id', TARGET_ID)
                    .maybeSingle();

                if (data) {
                    updateUI(data.count ?? 0);
                } else if (error) {
                    console.error(error);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updateUI(count) {
            const numEl = document.getElementById('currentCount');
            const badgeEl = document.getElementById('statusBadge');
            
            numEl.innerText = Math.max(0, count);

            if (count === 0) {
                numEl.classList.add('text-rose-500');
                numEl.classList.remove('text-white');
                badgeEl.innerText = '満 席';
                badgeEl.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30 mb-6';
            } else {
                numEl.classList.remove('text-rose-500');
                numEl.classList.add('text-white');
                badgeEl.innerText = '配布中';
                badgeEl.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 mb-6';
            }
        }

        function subscribeRealtime() {
            supabaseClient
                .channel(`public:tickets:view:${TARGET_ID}`)
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'tickets',
                    filter: `id=eq.${TARGET_ID}`
                }, (payload) => {
                    if (payload.new) {
                        updateUI(payload.new.count);
                    }
                })
                .subscribe();
        }

        window.onload = function() {
            fetchCount();
            subscribeRealtime();
        };
    </script>
</body>
</html>
