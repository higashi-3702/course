<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医進サイエンスコース - 管理者コントロールパネル</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans JP", sans-serif;
            background-color: #fafafa;
            color: #37352f;
        }

        .notion-card {
            background-color: #ffffff;
            border: 1px solid #e9e9e8;
            box-shadow: 0 1px 3px rgba(15, 15, 15, 0.05), 0 0 0 1px rgba(15, 15, 15, 0.02);
            border-radius: 12px;
        }

        .notion-btn {
            background-color: #ffffff;
            border: 1px solid #e3e2e0;
            color: #37352f;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04);
        }

        .notion-btn:hover {
            background-color: #f7f6f3;
            border-color: #d3d2d0;
        }

        .notion-btn-primary {
            background-color: #059669;
            border: 1px solid #047857;
            color: #ffffff;
            box-shadow: 0 1px 2px rgba(15, 15, 15, 0.08);
        }

        .notion-btn-primary:hover {
            background-color: #047857;
        }

        .modal-backdrop {
            background-color: rgba(15, 15, 15, 0.4);
            backdrop-filter: blur(4px);
        }

        /* 題名が1行で収まるレスポンシブフォントサイズ指定 */
        .single-line-title {
            font-size: clamp(1.25rem, 5vw, 2.75rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- ヘッダー -->
    <header class="max-w-4xl w-full mx-auto mt-2 md:mt-4 mb-4">
        <div class="flex justify-between items-start gap-4">
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-3xl md:text-5xl" role="img" aria-label="medical">🔬</span>
                    <span class="px-2.5 py-1 text-xs font-semibold rounded bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-user-shield"></i> 管理者操作モード
                    </span>
                </div>
                <!-- 1行に収まる題名 -->
                <h1 class="single-line-title font-extrabold tracking-tight text-[#37352f] mb-3" id="displayEventTitle">
                    医進サイエンスコース説明会
                </h1>
            </div>

            <div class="pt-2 flex flex-wrap gap-2 justify-end shrink-0">
                <a href="./index.html" class="notion-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 no-underline">
                    <i class="fa-solid fa-house text-neutral-500"></i> トップ
                </a>
                <a href="./ishin-viewer.html" class="notion-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 no-underline">
                    <i class="fa-solid fa-eye text-neutral-500"></i> モニター画面
                </a>
                <button onclick="openSettingsModal()" class="notion-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-gear text-neutral-500"></i> 設定
                </button>
                <button onclick="resetTickets()" class="notion-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-rose-600 border-rose-200 hover:bg-rose-50">
                    <i class="fa-solid fa-rotate-left"></i> リセット
                </button>
            </div>
        </div>
        
        <div class="flex flex-wrap items-center gap-3 text-sm text-[#37352f]/70 font-medium pt-3 border-t border-[#e9e9e8] mt-2">
            <div class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-lg border border-[#e9e9e8] shadow-sm">
                <span>⏱️</span>
                <span>時間: <strong class="text-[#37352f] font-semibold" id="displayEventTime">11:00-11:45</strong></span>
            </div>
            <div class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-lg border border-[#e9e9e8] shadow-sm">
                <span>👥</span>
                <span>定員: <strong class="text-[#37352f] font-semibold" id="displayTotalCount">150</strong>名</span>
            </div>
        </div>
    </header>

    <!-- メインコンテンツカード -->
    <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col justify-center my-2">
        <div class="notion-card p-6 md:p-12 relative overflow-hidden transition-all duration-300">
            
            <div class="text-center mb-2">
                <p class="text-xs md:text-sm font-semibold tracking-wider text-[#37352f]/60 uppercase mb-2">
                    現在の残り枚数
                </p>
                <div class="flex items-baseline justify-center gap-2">
                    <span id="remainingTickets" class="text-7xl sm:text-8xl md:text-9xl font-extrabold tracking-tight text-[#37352f]">
                        150
                    </span>
                    <span class="text-2xl md:text-3xl font-bold text-[#37352f]/50">枚</span>
                </div>
            </div>

            <!-- プログレス情報 -->
            <div class="max-w-2xl mx-auto my-6 text-center text-xs font-semibold text-[#37352f]/60">
                発券済み: <span id="issuedTickets" class="text-[#37352f] font-bold">0</span> 名 / 
                定員: <span id="capacityText" class="text-[#37352f] font-bold">150</span> 名
            </div>

            <!-- 管理操作パネル -->
            <div class="mt-6 pt-6 border-t border-[#f1f1ef] flex flex-col items-center">
                <!-- メイン +1 / -1 ボタン -->
                <div class="grid grid-cols-2 gap-4 w-full max-w-md">
                    <button id="btnMinus" onclick="changeCount(-1)" class="notion-btn group py-6 px-6 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 text-rose-600 hover:bg-rose-50/50 hover:border-rose-200">
                        <div class="flex items-center gap-2 text-3xl font-black">
                            <i class="fa-solid fa-minus"></i>
                            <span>1</span>
                        </div>
                        <span class="text-xs font-semibold text-[#37352f]/60 group-hover:text-rose-600">発券 (-1枚)</span>
                    </button>

                    <button id="btnPlus" onclick="changeCount(1)" class="notion-btn group py-6 px-6 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 text-emerald-600 hover:bg-emerald-50/50 hover:border-emerald-200">
                        <div class="flex items-center gap-2 text-3xl font-black">
                            <i class="fa-solid fa-plus"></i>
                            <span>1</span>
                        </div>
                        <span class="text-xs font-semibold text-[#37352f]/60 group-hover:text-emerald-600">キャンセル (+1枚)</span>
                    </button>
                </div>

                <!-- クイック増減ボタン -->
                <div class="flex flex-wrap justify-center gap-2 mt-4 max-w-md w-full">
                    <button onclick="changeCount(-10)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-neutral-100 text-neutral-600 hover:bg-neutral-200 active:scale-95 transition">-10</button>
                    <button onclick="changeCount(-5)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-neutral-100 text-neutral-600 hover:bg-neutral-200 active:scale-95 transition">-5</button>
                    <button onclick="changeCount(5)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-neutral-100 text-neutral-600 hover:bg-neutral-200 active:scale-95 transition">+5</button>
                    <button onclick="changeCount(10)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-neutral-100 text-neutral-600 hover:bg-neutral-200 active:scale-95 transition">+10</button>
                </div>
                
                <p class="text-[11px] text-[#37352f]/40 mt-4">
                    💡 ヒント: キーボードの <code class="bg-neutral-100 px-1 py-0.5 rounded border border-neutral-200">↓</code> または <code class="bg-neutral-100 px-1 py-0.5 rounded border border-neutral-200">-</code> キーで発券、<code class="bg-neutral-100 px-1 py-0.5 rounded border border-neutral-200">↑</code> または <code class="bg-neutral-100 px-1 py-0.5 rounded border border-neutral-200">+</code> キーでキャンセルできます。
                </p>
            </div>

        </div>
    </main>

    <!-- フッター -->
    <footer class="max-w-4xl w-full mx-auto flex justify-between items-center pt-4 border-t border-[#e9e9e8] text-[#37352f]/60 text-xs">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>医進サイエンスコース 管理者パネル</span>
        </div>
    </footer>

    <!-- イベント設定モーダル -->
    <div id="settingsModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
        <div class="notion-card bg-white rounded-2xl p-6 md:p-8 max-w-md w-full shadow-xl text-left border border-[#e9e9e8]">
            <div class="flex justify-between items-center mb-6 border-b border-[#f1f1ef] pb-3">
                <h3 class="text-lg font-bold text-[#37352f] flex items-center gap-2">
                    ⚙ <span>イベント設定</span>
                </h3>
                <button onclick="closeSettingsModal()" class="text-[#37352f]/40 hover:text-[#37352f]">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form onsubmit="saveSettings(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-[#37352f]/70 mb-1">イベント名</label>
                    <input type="text" id="inputEventTitle" required class="w-full bg-[#f7f6f3] border border-[#e9e9e8] rounded-lg px-3 py-2 text-sm text-[#37352f] focus:outline-none focus:border-[#059669]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#37352f]/70 mb-1">開催時間</label>
                    <input type="text" id="inputEventTime" required class="w-full bg-[#f7f6f3] border border-[#e9e9e8] rounded-lg px-3 py-2 text-sm text-[#37352f] focus:outline-none focus:border-[#059669]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#37352f]/70 mb-1">上限人数（名）</label>
                    <input type="number" id="inputCapacity" min="1" max="10000" required class="w-full bg-[#f7f6f3] border border-[#e9e9e8] rounded-lg px-3 py-2 text-sm text-[#37352f] focus:outline-none focus:border-[#059669]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#37352f]/70 mb-1">現在の残り枚数を指定</label>
                    <input type="number" id="inputRemaining" min="0" required class="w-full bg-[#f7f6f3] border border-[#e9e9e8] rounded-lg px-3 py-2 text-sm text-[#37352f] focus:outline-none focus:border-[#059669]">
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeSettingsModal()" class="flex-1 bg-[#f7f6f3] hover:bg-[#efefe0] text-[#37352f] font-semibold py-2.5 rounded-lg text-sm transition">
                        キャンセル
                    </button>
                    <button type="submit" class="flex-1 notion-btn-primary font-semibold py-2.5 rounded-lg text-sm transition">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'ishin_ticket_app_secure_state_v1';

        let state = {
            eventTitle: "医進サイエンスコース説明会",
            eventTime: "11:00-11:45",
            totalCapacity: 150,
            remaining: 150
        };

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.totalCapacity !== undefined) {
                        state = parsed;
                    }
                } catch(e) {
                    console.error("Failed to load state", e);
                }
            }
            updateUI();
        }

        function saveStateToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function updateUI() {
            document.getElementById('displayEventTitle').innerText = state.eventTitle;
            document.getElementById('displayEventTime').innerText = state.eventTime;
            document.getElementById('displayTotalCount').innerText = state.totalCapacity;
            document.getElementById('capacityText').innerText = state.totalCapacity;

            const remaining = Math.max(0, Math.min(state.remaining, state.totalCapacity));
            state.remaining = remaining;
            const issued = state.totalCapacity - remaining;

            document.getElementById('remainingTickets').innerText = remaining;
            document.getElementById('issuedTickets').innerText = issued;

            saveStateToStorage();
        }

        function changeCount(delta) {
            const nextVal = state.remaining + delta;
            if (nextVal < 0 || nextVal > state.totalCapacity) return;
            state.remaining = nextVal;
            updateUI();
        }

        function resetTickets() {
            if (confirm(`残り枚数を初期値の ${state.totalCapacity} 枚にリセットしますか？`)) {
                state.remaining = state.totalCapacity;
                updateUI();
            }
        }

        function openSettingsModal() {
            document.getElementById('inputEventTitle').value = state.eventTitle;
            document.getElementById('inputEventTime').value = state.eventTime;
            document.getElementById('inputCapacity').value = state.totalCapacity;
            document.getElementById('inputRemaining').value = state.remaining;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings(e) {
            e.preventDefault();

            const newTitle = document.getElementById('inputEventTitle').value.trim();
            const newTime = document.getElementById('inputEventTime').value.trim();
            const newCapacity = parseInt(document.getElementById('inputCapacity').value, 10);
            const newRemaining = parseInt(document.getElementById('inputRemaining').value, 10);

            if (newCapacity <= 0 || newRemaining > newCapacity) return;

            state.eventTitle = newTitle;
            state.eventTime = newTime;
            state.totalCapacity = newCapacity;
            state.remaining = newRemaining;

            updateUI();
            closeSettingsModal();
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('settingsModal').classList.contains('hidden')) return;

            if (e.key === '-' || e.key === 'ArrowDown') {
                changeCount(-1);
            } else if (e.key === '+' || e.key === 'ArrowUp') {
                changeCount(1);
            }
        });

        window.onload = function() {
            loadState();
        };
    </script>
</body>
</html>
