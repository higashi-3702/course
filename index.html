<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>説明会整理券管理ポータル</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans JP", sans-serif;
            background-color: #fafafa;
            color: #37352f;
        }

        .notion-card {
            background-color: #ffffff;
            border: 1px solid #e9e9e8;
            box-shadow: 0 4px 20px rgba(15, 15, 15, 0.05), 0 0 0 1px rgba(15, 15, 15, 0.02);
            border-radius: 16px;
        }

        .notion-btn {
            background-color: #ffffff;
            border: 1px solid #e3e2e0;
            color: #37352f;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04);
        }

        .notion-btn:hover {
            background-color: #f7f6f3;
            border-color: #d3d2d0;
            transform: translateY(-2px);
        }

        .course-card {
            transition: all 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .single-line-title {
            font-size: clamp(1.5rem, 5vw, 3rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-backdrop {
            background-color: rgba(15, 15, 15, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- ヘッダー -->
    <header class="max-w-5xl w-full mx-auto flex justify-between items-center gap-4 py-2">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🏫</span>
            <span class="font-bold text-[#37352f] text-sm md:text-base">コース説明会 ポータル</span>
        </div>

        <button onclick="openAuthModal()" class="notion-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-amber-800 bg-amber-50 border-amber-200 hover:bg-amber-100 flex items-center gap-1.5">
            <i class="fa-solid fa-lock"></i>
            <span>管理者ページ</span>
        </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-5xl w-full mx-auto flex-1 flex flex-col justify-center my-6">
        
        <div class="text-center mb-8">
            <h1 class="single-line-title font-black tracking-tight text-[#37352f] mb-2">
                整理券状況 閲覧モニター
            </h1>
            <p class="text-xs md:text-base font-semibold text-[#37352f]/60">
                表示したいコースのボタンを選択してください
            </p>
        </div>

        <!-- 閲覧モニター リンク一覧 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6 max-w-4xl mx-auto w-full">
            
            <!-- フロンティア閲覧 -->
            <a href="./フロンティア_閲覧.html" class="course-card notion-card p-6 md:p-8 flex items-center justify-between no-underline text-[#37352f] border-l-8 border-l-indigo-500 hover:border-indigo-600">
                <div class="flex items-center gap-4">
                    <span class="text-4xl md:text-5xl">🚀</span>
                    <div>
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">モニター画面</span>
                        <h2 class="text-xl md:text-2xl font-black mt-1">フロンティア</h2>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-lg text-neutral-400"></i>
            </a>

            <!-- 文理共創閲覧 -->
            <a href="./文理共創_閲覧.html" class="course-card notion-card p-6 md:p-8 flex items-center justify-between no-underline text-[#37352f] border-l-8 border-l-amber-500 hover:border-amber-600">
                <div class="flex items-center gap-4">
                    <span class="text-4xl md:text-5xl">🌱</span>
                    <div>
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">モニター画面</span>
                        <h2 class="text-xl md:text-2xl font-black mt-1">文理共創</h2>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-lg text-neutral-400"></i>
            </a>

            <!-- 国際教養閲覧 -->
            <a href="./国際教養_閲覧.html" class="course-card notion-card p-6 md:p-8 flex items-center justify-between no-underline text-[#37352f] border-l-8 border-l-sky-500 hover:border-sky-600">
                <div class="flex items-center gap-4">
                    <span class="text-4xl md:text-5xl">🌍</span>
                    <div>
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-sky-100 text-sky-800">モニター画面</span>
                        <h2 class="text-xl md:text-2xl font-black mt-1">国際教養</h2>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-lg text-neutral-400"></i>
            </a>

            <!-- 医進サイエンス閲覧 -->
            <a href="./医進サイエンス_閲覧.html" class="course-card notion-card p-6 md:p-8 flex items-center justify-between no-underline text-[#37352f] border-l-8 border-l-emerald-500 hover:border-emerald-600">
                <div class="flex items-center gap-4">
                    <span class="text-4xl md:text-5xl">🔬</span>
                    <div>
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">モニター画面</span>
                        <h2 class="text-xl md:text-2xl font-black mt-1">医進サイエンス</h2>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-lg text-neutral-400"></i>
            </a>

        </div>

    </main>

    <!-- フッター -->
    <footer class="max-w-5xl w-full mx-auto text-center pt-6 border-t border-[#e9e9e8] text-[#37352f]/40 text-xs">
        © 整理券リアルタイム管理ポータル
    </footer>

    <!-- パスワード認証モーダル -->
    <div id="authModal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
        <div class="notion-card bg-white rounded-2xl p-6 md:p-8 max-w-sm w-full shadow-xl text-left border border-[#e9e9e8]">
            <div class="flex justify-between items-center mb-4 border-b border-[#f1f1ef] pb-3">
                <h3 class="text-base font-bold text-[#37352f] flex items-center gap-2">
                    🔒 <span>管理者認証</span>
                </h3>
                <button onclick="closeAuthModal()" class="text-[#37352f]/40 hover:text-[#37352f]">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- パスワード入力ステップ -->
            <div id="passwordStep">
                <p class="text-xs text-[#37352f]/70 mb-3 font-medium">
                    パスワードを入力してください（初期値: <code class="bg-amber-100 px-1 rounded text-amber-900 font-bold">1234</code>）
                </p>
                <form onsubmit="verifyPassword(event)" class="space-y-3">
                    <input type="password" id="adminPasswordInput" placeholder="パスワードを入力" required class="w-full bg-[#f7f6f3] border border-[#e9e9e8] rounded-lg px-3 py-2 text-sm text-[#37352f] focus:outline-none focus:border-amber-500">
                    <p id="errorMessage" class="text-xs text-rose-600 font-semibold hidden">パスワードが間違っています。</p>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 rounded-lg text-sm transition">
                        認証する
                    </button>
                </form>
            </div>

            <!-- 管理画面 選択ステップ（認証成功後） -->
            <div id="courseSelectStep" class="hidden">
                <p class="text-xs text-emerald-600 font-bold mb-3 flex items-center gap-1">
                    <i class="fa-solid fa-circle-check"></i> 認証成功。コースを選択してください：
                </p>
                <div class="space-y-2">
                    <!-- フロンティア管理 -->
                    <a href="./フロンティア_管理.html" class="flex items-center gap-2.5 px-3 py-2.5 text-xs font-bold text-[#37352f] bg-[#f7f6f3] hover:bg-neutral-200 rounded-lg no-underline transition border border-[#e9e9e8]">
                        <span>🚀</span> フロンティア 管理画面
                    </a>
                    <!-- 文理共創管理 -->
                    <a href="./文理共創_管理.html" class="flex items-center gap-2.5 px-3 py-2.5 text-xs font-bold text-[#37352f] bg-[#f7f6f3] hover:bg-neutral-200 rounded-lg no-underline transition border border-[#e9e9e8]">
                        <span>🌱</span> 文理共創 管理画面
                    </a>
                    <!-- 国際教養管理 -->
                    <a href="./国際教養_管理.html" class="flex items-center gap-2.5 px-3 py-2.5 text-xs font-bold text-[#37352f] bg-[#f7f6f3] hover:bg-neutral-200 rounded-lg no-underline transition border border-[#e9e9e8]">
                        <span>🌍</span> 国際教養 管理画面
                    </a>
                    <!-- 医進サイエンス管理 -->
                    <a href="./医進サイエンス_管理.html" class="flex items-center gap-2.5 px-3 py-2.5 text-xs font-bold text-[#37352f] bg-[#f7f6f3] hover:bg-neutral-200 rounded-lg no-underline transition border border-[#e9e9e8]">
                        <span>🔬</span> 医進サイエンス 管理画面
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "1234";

        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('passwordStep').classList.remove('hidden');
            document.getElementById('courseSelectStep').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = '';
            setTimeout(() => document.getElementById('adminPasswordInput').focus(), 100);
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
        }

        function verifyPassword(e) {
            e.preventDefault();
            const inputVal = document.getElementById('adminPasswordInput').value;
            if (inputVal === ADMIN_PASSWORD) {
                document.getElementById('passwordStep').classList.add('hidden');
                document.getElementById('courseSelectStep').classList.remove('hidden');
            } else {
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
